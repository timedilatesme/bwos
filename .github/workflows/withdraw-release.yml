name: Withdraw BWOS 2.0.0
on:
  push:
    branches: [codex/withdraw-v2.0.0]
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish the withdrawn release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v2.0.0 --draft=true
