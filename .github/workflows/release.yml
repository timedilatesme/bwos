name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and release notes
        run: |
          $version = (Select-String -Path 'replacement/host/App.cs' -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'The tag must match the application version.' }
          if (-not (Test-Path "docs/RELEASE_$version.md")) { throw 'Release notes are missing.' }
          "BWOS_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Host checks
        run: |
          .\tools\test-features.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Host checks failed.' }
      - name: JavaScript checks
        run: |
          $testFiles = @(Get-ChildItem 'tests/*.test.mjs' | ForEach-Object FullName)
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript checks failed.' }
          $coreTests = @(Get-ChildItem 'replacement/tests/*.test.mjs' | ForEach-Object FullName)
          node --test @coreTests
          if ($LASTEXITCODE -ne 0) { throw 'Replacement checks failed.' }
      - name: Build portable Windows package
        run: .\build.ps1 -Test -Zip
      - name: Verify package and write checksum
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/BWOS-$env:BWOS_RELEASE_VERSION.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            if (-not ($archive.Entries | Where-Object FullName -eq 'BWOS.exe')) { throw 'The package is missing BWOS.exe.' }
            if ($archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])(data|_metadata)([\\/]|$)|(^|[\\/])session\.key$' }) { throw 'The package includes runtime data or browser cache.' }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BWOS-$env:BWOS_RELEASE_VERSION.zip" | Set-Content "$zipPath.sha256" -Encoding ascii
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:BWOS_RELEASE_VERSION
          gh release create $env:GITHUB_REF_NAME "dist/BWOS-$version.zip" "dist/BWOS-$version.zip.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --title "BWOS $version" --notes-file "docs/RELEASE_$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
