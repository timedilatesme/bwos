<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BWOS Next</title><link rel="stylesheet" href="shell.css"></head><body>
<header><a class="brand" href="#home">BWOS <small>NEXT</small></a><nav aria-label="Screens"></nav><span id="identity"></span></header>
<main id="screen" tabindex="-1"></main><aside id="cloud" aria-label="Now playing" hidden></aside><footer><span id="hints">Arrows · Navigate　Enter · Select　Esc · Back　Home · Home　X · Player</span><span id="connection">Connecting…</span></footer>
<dialog id="keyboard" aria-label="Search"><h2>Find something to watch</h2><input id="query" type="text" maxlength="200" autocomplete="off" spellcheck="false" aria-label="Search text"><div id="keys"></div><div class="actions"><button id="search-submit">Search</button><button id="search-close">Cancel</button></div><p>Type with a controller, keyboard or paired phone. English and Hindi are accepted.</p></dialog>
<dialog id="details"><div id="detail-content"></div><button id="detail-close">Close</button></dialog>
<div id="assistant" role="status" aria-live="polite" hidden></div><div id="notice" role="status" aria-live="polite"></div>
<script src="js/qr.js"></script><script type="module" src="shell.js"></script></body></html>
