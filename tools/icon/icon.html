<!doctype html>
<!--
  BWOS app icon, rendered by tools/make-icon.ps1 (headless Edge → PNG → ICO). The same shape drives
  the intro animation in ui/index.html. 1024 × 1024, transparent. "?small" = the 16–32 px version.

  Concept: the shape is the icon. A minimal DualSense-style controller silhouette in soft white and
  silver, with one point of colour: the home button, lit. A fine edge keeps it readable on light
  backgrounds; the drop shadow lifts it off dark ones.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; }
  .small #edge { stroke-width: 16; stroke-opacity: 0.45; }
  .small #halo { display: none; }
  .small #home-dot { r: 40px; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <path id="body"/>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#eceef4"/><stop offset="1" stop-color="#c9cdd9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="home" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8bff"/><stop offset="0.5" stop-color="#4cc8ff"/><stop offset="1" stop-color="#ff7ad0"/>
    </linearGradient>
    <clipPath id="clip-body"><use href="#body"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <g transform="translate(512 512) scale(0.97) translate(-512 -586)">
    <use href="#body" fill="url(#shell)" filter="url(#shadow)"/>
    <g clip-path="url(#clip-body)">
      <!-- a soft highlight along the top edge, like light on a glossy shell -->
      <rect x="0" y="286" width="1024" height="140" fill="url(#sheen)" opacity="0.7"/>
    </g>
    <use id="edge" href="#body" fill="none" stroke="#1a1c24" stroke-opacity="0.28" stroke-width="5"/>
    <!-- the home button, lit -->
    <circle id="halo" cx="512" cy="540" r="36" fill="url(#home)" filter="url(#glow)" opacity="0.85"/>
    <circle id="home-dot" cx="512" cy="540" r="24" fill="url(#home)"/>
  </g>
</svg>
<script>
  if (location.search.includes('small')) document.body.classList.add('small');
  // The silhouette: the right half as cubic segments, mirrored for the left, so it is exactly symmetric.
  const right = [[512, 292], [628, 292], [722, 292, 784, 288, 830, 322], [874, 354, 896, 414, 912, 486],
    [932, 574, 962, 684, 964, 760], [966, 836, 916, 880, 858, 874], [806, 868, 780, 826, 756, 774],
    [730, 716, 700, 650, 636, 632], [590, 620, 552, 630, 512, 630]];
  const m = (x) => 1024 - x, p = (x, y) => x + ' ' + y;
  let d = 'M' + p(...right[0]) + ' L' + p(...right[1]);
  for (const c of right.slice(2)) d += ' C' + p(c[0], c[1]) + ' ' + p(c[2], c[3]) + ' ' + p(c[4], c[5]);
  const segs = right.slice(2), ends = [right[1], ...segs.map((c) => [c[4], c[5]])];
  for (let i = segs.length - 1; i >= 0; i--) { const c = segs[i], e = ends[i]; d += ' C' + p(m(c[2]), c[3]) + ' ' + p(m(c[0]), c[1]) + ' ' + p(m(e[0]), e[1]); }
  d += ' L' + p(...right[0]) + ' Z';
  document.getElementById('body').setAttribute('d', d);
</script>
</body>
</html>
